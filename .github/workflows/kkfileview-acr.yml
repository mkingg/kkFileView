# Copy this file to .github/workflows/kkfileview-acr.yml on the
# build/kkfileview-acr branch of your fork of kekingcn/kkFileView.
# Create and push a tag named acr-kkfileview-5.0.3-* at that branch's commit to build.
# Configure repository secrets ACR_USERNAME and ACR_PASSWORD before tagging.
name: Build kkFileView 5.0.3 for ACR

on:
  push:
    tags:
      - 'acr-kkfileview-5.0.3-*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    env:
      IMAGE: registry.cn-beijing.aliyuncs.com/mking/kkfileview

    steps:
      - name: Check out fork at upstream v5.0.3 commit
        uses: actions/checkout@v7
        with:
          ref: 3b82689a676e8a7e7d3ec4cc0c74de0676b0dac9
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package upstream application
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          mvn -B -pl server -am -DskipTests package
          test -f server/target/kkFileView-5.0.3.tar.gz

      - name: Compose pinned base and application Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path('docker/kkfileview-base/Dockerfile').read_text()
          app = Path('Dockerfile').read_text()
          assert base.count('FROM ubuntu:24.04') == 1
          assert base.count('ADD fonts/*') == 1
          assert app.count('FROM keking/kkfileview-base:5.0.0') == 1
          base = base.replace('FROM ubuntu:24.04', 'FROM ubuntu:24.04 AS kkfileview-base', 1)
          base = base.replace('ADD fonts/*', 'ADD docker/kkfileview-base/fonts/*', 1)
          app = app.replace('FROM keking/kkfileview-base:5.0.0', 'FROM kkfileview-base', 1)
          Path('Dockerfile.acr.generated').write_text(base + '\n' + app)
          PY

      - name: Set up Docker container builder
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name kkfileview-acr --use
          docker buildx inspect --bootstrap

      - name: Push by digest to ACR
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          printf '%s' "$ACR_PASSWORD" | docker login registry.cn-beijing.aliyuncs.com \
            --username "$ACR_USERNAME" --password-stdin
          docker buildx build --builder kkfileview-acr --platform '${{ matrix.platform }}' \
            --output "type=image,name=$IMAGE,push=true,push-by-digest=true,name-canonical=true" \
            --provenance=false --metadata-file image-metadata.json -f Dockerfile.acr.generated .
          DIGEST="$(jq -r '."containerimage.digest" // empty' image-metadata.json)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker pull --platform '${{ matrix.platform }}' "$IMAGE@$DIGEST"
          docker run --rm --platform '${{ matrix.platform }}' --entrypoint sh "$IMAGE@$DIGEST" \
            -c 'java -version && libreoffice --version && test -f /opt/kkFileView-5.0.3/bin/kkFileView-5.0.3.jar'
          mkdir -p digests
          printf '%s' "$DIGEST" > 'digests/${{ matrix.arch }}'

      - name: Share digest with publish job
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish-multiarch:
    name: Publish multi-architecture tag
    needs: build
    runs-on: ubuntu-24.04
    env:
      IMAGE: registry.cn-beijing.aliyuncs.com/mking/kkfileview
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Combine platform images and verify manifest
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ACR_USERNAME"
          test -n "$ACR_PASSWORD"
          printf '%s' "$ACR_PASSWORD" | docker login registry.cn-beijing.aliyuncs.com \
            --username "$ACR_USERNAME" --password-stdin
          DIGEST_AMD64="$(cat digests/amd64)"
          DIGEST_ARM64="$(cat digests/arm64)"
          [[ "$DIGEST_AMD64" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$DIGEST_ARM64" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create -t "$IMAGE:5.0.3" \
            "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
          docker buildx imagetools inspect "$IMAGE:5.0.3"
          docker buildx imagetools inspect --raw "$IMAGE:5.0.3" | \
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | unique | sort == ["amd64", "arm64"]'
